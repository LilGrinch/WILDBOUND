<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wildbound 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#87b8d8;touch-action:none;font-family:system-ui}#game{width:100%;height:100%;display:block}#hud{position:fixed;top:12px;left:12px;color:white;text-shadow:0 2px 4px #000;font-weight:700;z-index:3}.bar{width:120px;height:7px;background:#222b;margin:3px 0 6px;border-radius:8px}.fill{height:100%;background:white}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;z-index:3;pointer-events:none}#cross:before,#cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 2px #000}#cross:before{width:16px;height:2px;top:7px}#cross:after{height:16px;width:2px;left:7px}#joy{position:fixed;left:22px;bottom:24px;width:116px;height:116px;border:2px solid #fff8;border-radius:50%;background:#ffffff22;z-index:5}#knob{position:absolute;left:31px;top:31px;width:50px;height:50px;border:2px solid #fff8;border-radius:50%;background:#fff5}#look{position:fixed;right:0;bottom:0;width:60%;height:65%;z-index:4}#start{position:fixed;inset:0;background:#102019ed;color:#fff;z-index:10;display:grid;place-items:center}.card{max-width:330px;margin:20px;padding:24px;text-align:center;background:#1d2b24ee;border-radius:18px}button{padding:13px 20px;border:0;border-radius:12px;background:#d8a84e;font-weight:700;font-size:16px}.small{opacity:.8;font-size:13px;line-height:1.4}#toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%);background:#111c;color:#fff;padding:9px 13px;border-radius:10px;opacity:0;z-index:8}</style></head><body><canvas id="game"></canvas><div id="hud">❤️ <span id="hp">100</span><div class="bar"><div id="hpbar" class="fill"></div></div>🥩 <span id="food">100</span><div class="bar"><div id="foodbar" class="fill"></div></div>💧 <span id="water">100</span><div class="bar"><div id="waterbar" class="fill"></div></div></div><div id="cross"></div><div id="joy"><div id="knob"></div></div><div id="look"></div><div id="toast"></div><div id="start"><div class="card"><h1>🌲 Wildbound</h1><p>First-person 3D prototype</p><p class="small">Use the left joystick to walk. Drag on the right side to look. Tap trees and rocks when you're close enough to gather them.</p><button id="startBtn">Enter the wilderness</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x8db9d2);scene.fog=new THREE.Fog(0x8db9d2,35,120);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,180);camera.position.set(0,1.7,10);camera.rotation.order='YXZ';scene.add(new THREE.HemisphereLight(0xbfe2ff,0x42503c,1.8));const sun=new THREE.DirectionalLight(0xfff0c5,2.1);sun.position.set(-35,55,20);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x4c743f,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const trunk=new THREE.MeshStandardMaterial({color:0x63442c}),leaves=[0x2f5d35,0x3f7440,0x527d3d].map(c=>new THREE.MeshStandardMaterial({color:c})),rockMat=new THREE.MeshStandardMaterial({color:0x777b78});const resources=[];const rand=(a,b)=>a+Math.random()*(b-a);
function tree(x,z,s){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.28*s,.38*s,3.2*s,8),trunk);t.position.y=1.6*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((1.35-i*.12)*s,2.4*s,9),leaves[i]);c.position.y=(3.1+i*.7)*s;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g);resources.push({obj:g,type:'tree',x,z,alive:true})}function rock(x,z,s){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.65*s),rockMat);r.position.set(x,.45*s,z);r.scale.y=.65;r.castShadow=true;scene.add(r);resources.push({obj:r,type:'rock',x,z,alive:true})}for(let i=0;i<85;i++){let x,z;do{x=rand(-70,70);z=rand(-70,70)}while(Math.hypot(x,z)<9);tree(x,z,rand(.75,1.25))}for(let i=0;i<35;i++){let x,z;do{x=rand(-65,65);z=rand(-65,65)}while(Math.hypot(x,z)<7);rock(x,z,rand(.6,1.2))}
const state={hp:100,food:100,water:100,wood:0,stone:0};let yaw=0,pitch=0,started=false,last=performance.now();const move={x:0,y:0},joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),look=document.querySelector('#look');let jp=null,lp=null,lx=0,ly=0;function setJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=42,d=Math.hypot(dx,dy),q=Math.min(1,m/d||0);const x=dx*q,y=dy*q;knob.style.transform=`translate(${x}px,${y}px)`;move.x=x/m;move.y=y/m}joy.addEventListener('pointerdown',e=>{jp=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jp)setJoy(e)});['pointerup','pointercancel'].forEach(n=>joy.addEventListener(n,()=>{jp=null;move.x=move.y=0;knob.style.transform=''}));look.addEventListener('pointerdown',e=>{lp=e.pointerId;look.setPointerCapture(e.pointerId);lx=e.clientX;ly=e.clientY});look.addEventListener('pointermove',e=>{if(e.pointerId!==lp)return;yaw-=(e.clientX-lx)*.006;pitch-=(e.clientY-ly)*.006;pitch=Math.max(-1.35,Math.min(1.35,pitch));lx=e.clientX;ly=e.clientY});['pointerup','pointercancel'].forEach(n=>look.addEventListener(n,()=>lp=null));const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function hud(){for(const k of ['hp','food','water']){document.querySelector('#'+k).textContent=Math.round(state[k]);document.querySelector('#'+k+'bar').style.width=Math.max(0,state[k])+'%'}}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1;clearTimeout(t.x);t.x=setTimeout(()=>t.style.opacity=0,1400)}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(started){let mx=move.x+(keys.d?1:0)-(keys.a?1:0),my=move.y+(keys.s?1:0)-(keys.w?1:0),d=Math.hypot(mx,my);if(d>1){mx/=d;my/=d}const sp=5.2,f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(f,-my*sp*dt);camera.position.addScaledVector(r,mx*sp*dt);camera.position.x=Math.max(-98,Math.min(98,camera.position.x));camera.position.z=Math.max(-98,Math.min(98,camera.position.z));camera.position.y=1.7;camera.rotation.y=yaw;camera.rotation.x=pitch;state.food=Math.max(0,state.food-dt*.7);state.water=Math.max(0,state.water-dt*.95);if(state.food===0||state.water===0)state.hp=Math.max(0,state.hp-dt*2);hud()}renderer.render(scene,camera)}requestAnimationFrame(frame);
document.querySelector('#startBtn').onclick=()=>{started=true;document.querySelector('#start').style.display='none';toast('Explore the forest 🌲')};canvas.addEventListener('pointerdown',()=>{if(!started)return;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const targets=resources.filter(r=>r.alive).map(r=>r.obj),hit=ray.intersectObjects(targets,true)[0];if(!hit)return;if(camera.position.distanceTo(hit.point)>5){toast('Move closer');return}const found=resources.find(r=>r.alive&&(r.obj===hit.object||r.obj.children.includes(hit.object)));if(found){found.alive=false;found.obj.visible=false;if(found.type==='tree'){state.wood++;toast('Wood +1 🪵')}else{state.stone++;toast('Stone +1 🪨')}}});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html><!-- Wildbound -->
